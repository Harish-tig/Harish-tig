<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 150" width="860" height="150">
  <defs>
    <style>
      .tm { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
      .title-font { font-family: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; font-weight: 800; }
      @keyframes floatAnim {
        0%   { transform: translateY(0px) rotate(0deg); }
        50%  { transform: translateY(-6px) rotate(-1.5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes miniFloat {
        0%   { transform: translateY(0px) scale(0.55); }
        50%  { transform: translateY(-4px) scale(0.55); }
        100% { transform: translateY(0px) scale(0.55); }
      }
      .crew-float {
        animation: floatAnim 3.8s ease-in-out infinite;
      }
      .mini-float {
        animation: miniFloat 3.2s ease-in-out infinite;
      }
    </style>
    <clipPath id="type-clip">
      <rect x="22" y="56" height="42" width="0">
        <animate attributeName="width" from="0" to="620" dur="1.8s" begin="0.3s" fill="freeze" calcMode="linear"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Deep space background -->
  <rect width="860" height="150" rx="12" fill="#080c14"/>

  <!-- Starfield texture (twinkling space) -->
  <g opacity="0.75">
    <circle cx="85" cy="42" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="120" r="1" fill="#7dd3fc">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="280" cy="38" r="0.9" fill="#c084fc">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="390" cy="130" r="1.3" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="480" cy="45" r="1" fill="#fef08a">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="115" r="0.8" fill="#38bdf8">
      <animate attributeName="opacity" values="0.1;0.9;0.1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="650" cy="50" r="1.2" fill="#ffffff">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="125" r="1" fill="#c084fc">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="2.9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Terminal border -->
  <rect x="0.8" y="0.8" width="858.4" height="148.4" rx="12" fill="none" stroke="#263142" stroke-width="1.2"/>

  <!-- Titlebar -->
  <line x1="0" y1="30" x2="860" y2="30" stroke="#1e293b" stroke-width="1"/>
  <circle cx="18" cy="15" r="4.5" fill="#ef4444"/>
  <circle cx="34" cy="15" r="4.5" fill="#eab308"/>
  <circle cx="50" cy="15" r="4.5" fill="#22c55e"/>

  <text class="tm" x="430" y="19" fill="#64748b" font-size="11" text-anchor="middle" font-weight="600">
    harish@the-skeld: ~ [terminal]
  </text>

  <!-- Among Us Role Badge (Top Right) -->
  <g transform="translate(712, 7)">
    <rect width="132" height="18" rx="9" fill="#14532d" stroke="#22c55e" stroke-width="0.8" opacity="0.9"/>
    <circle cx="12" cy="9" r="3.5" fill="#4ade80"/>
    <text class="tm" x="22" y="12.5" fill="#86efac" font-size="9" font-weight="700" letter-spacing="0.5">ROLE: CREWMATE</text>
  </g>

  <!-- ── Among Us Crewmate (Vector character on the right) ──────────────── -->
  <g class="crew-float" transform="translate(732, 42)">
    <!-- Backpack -->
    <rect x="0" y="24" width="14" height="42" rx="7" fill="#7e22ce" stroke="#1e1b4b" stroke-width="3"/>
    <!-- Main Body -->
    <path d="M 12 28 C 12 10, 56 10, 56 28 L 56 70 C 56 76, 50 82, 43 82 L 39 82 C 35 82, 33 78, 33 74 L 33 66 L 29 66 L 29 74 C 29 78, 27 82, 23 82 L 19 82 C 12 82, 8 76, 8 70 Z"
          fill="#9333ea" stroke="#1e1b4b" stroke-width="3.5"/>
    <!-- Body shadow for depth -->
    <path d="M 8 56 C 14 62, 36 64, 56 56 L 56 70 C 56 76, 50 82, 43 82 L 39 82 C 35 82, 33 78, 33 74 L 33 66 L 29 66 L 29 74 C 29 78, 27 82, 23 82 L 19 82 C 12 82, 8 76, 8 70 Z"
          fill="#7e22ce" opacity="0.6"/>
    <!-- Visor -->
    <rect x="25" y="20" width="35" height="22" rx="11" fill="#38bdf8" stroke="#1e1b4b" stroke-width="3"/>
    <!-- Visor Reflection Highlight -->
    <ellipse cx="37" cy="26" rx="11" ry="4.5" fill="#f0f9ff" opacity="0.85"/>
    <!-- Little Crewmate Sprout Hat -->
    <path d="M 34 10 Q 32 3 24 6 Q 30 11 34 11 Q 38 11 44 6 Q 36 3 34 10 Z" fill="#4ade80" stroke="#14532d" stroke-width="1.2"/>
  </g>

  <!-- Mini Pet Crewmate (Cyan) -->
  <g class="mini-float" transform="translate(792, 78)">
    <!-- Backpack -->
    <rect x="0" y="24" width="14" height="42" rx="7" fill="#0284c7" stroke="#082f49" stroke-width="3.5"/>
    <!-- Body -->
    <path d="M 12 28 C 12 10, 56 10, 56 28 L 56 70 C 56 76, 50 82, 43 82 L 39 82 C 35 82, 33 78, 33 74 L 33 66 L 29 66 L 29 74 C 29 78, 27 82, 23 82 L 19 82 C 12 82, 8 76, 8 70 Z"
          fill="#06b6d4" stroke="#082f49" stroke-width="3.5"/>
    <!-- Visor -->
    <rect x="25" y="20" width="35" height="22" rx="11" fill="#e0f2fe" stroke="#082f49" stroke-width="3.5"/>
    <ellipse cx="37" cy="26" rx="11" ry="4.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- ── Terminal Command Prompt ────────────────────────────────────────── -->
  <text class="tm" x="24" y="52" fill="#22c55e" font-size="13" font-weight="800">❯</text>
  <text class="tm" x="40" y="52" fill="#94a3b8" font-size="12.5" font-weight="500">./introduce.sh</text>

  <!-- ── Typed Title (HARISH NADAR - SDE | Backend | AIML) ───────────────── -->
  <g clip-path="url(#type-clip)">
    <text class="title-font" x="24" y="88" fill="#f8fafc" font-size="24" letter-spacing="-0.3">
      HARISH NADAR
      <tspan fill="#64748b" font-weight="400"> — </tspan>
      <tspan fill="#c084fc" font-size="18.5" font-weight="600">SDE | Backend | AIML</tspan>
    </text>
  </g>

  <!-- ── Blinking Cursor ────────────────────────────────────────────────── -->
  <rect y="68" width="12" height="23" fill="#22c55e" rx="1">
    <animate attributeName="x" from="24" to="585" dur="1.8s" begin="0.3s" fill="freeze" calcMode="linear"/>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.51;1" dur="0.85s" begin="2.10s" repeatCount="indefinite"/>
  </rect>

  <!-- ── Tagline (Fades In) ─────────────────────────────────────────────── -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="2.30s" fill="freeze"/>
    <text class="tm" x="25" y="122" fill="#94a3b8" font-size="13" font-style="italic">
      "a little bit of this and a little bit of that aaahhh techie"
    </text>
  </g>
</svg>
