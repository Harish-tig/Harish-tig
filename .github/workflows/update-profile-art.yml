name: Refresh Profile Data & Art

on:
  schedule:
    # Runs daily at 00:30 UTC (06:00 IST) — staggered slightly to avoid GH peak load
    - cron: "30 0 * * *"
  workflow_dispatch:   # manual trigger: Actions tab -> Refresh Profile Data & Art -> Run workflow

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: Harish-tig

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # ── Dynamic asset generation ──────────────────────────────────────────
      - name: Fetch latest contribution data
        run: python scripts/fetch_contributions.py

      - name: Generate purple-snake contribution graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/generate_snake_svg.py --user $GH_PROFILE_USER

      # ── Commit only if files changed (no empty commits) ──────────────────
      - name: Commit and push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add assets/svg/snake-contributions.svg contrib-heatmap.svg data/contributions.json

          if git diff --cached --quiet; then
            echo "Nothing changed — skipping commit."
          else
            git commit -m "chore: refresh profile stats [skip ci]"
            git push
          fi
